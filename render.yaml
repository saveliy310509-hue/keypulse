# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Free-план:
#   • сервис засыпает после 15 минут без запросов  -> лечится KEEPALIVE_URL
#   • диск недоступен, файловая система стирается  -> база в Turso (LIBSQL_URL)
#
# После создания сервиса Render даст домен вида https://keypulse.onrender.com —
# пропиши его в KEEPALIVE_URL (окружение -> Environment -> Add Environment Variable).
services:
  - type: web
    name: keypulse
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: API_SECRET
        sync: false
      # Turso: https://app.turso.tech -> Create Database -> URL + Token
      - key: LIBSQL_URL
        sync: false
      - key: LIBSQL_AUTH_TOKEN
        sync: false
      # Публичный адрес этого сервиса, чтобы он сам себя не давал усыпить
      - key: KEEPALIVE_URL
        sync: false
      - key: KEEPALIVE_INTERVAL
        value: "600"
      - key: PYTHON_VERSION
        value: 3.12.0
